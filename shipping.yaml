- name: server configurstion for shipping
  hosts: shipping
  become: yes
  tasks:
    - name: enable a maven module 
      command: dnf module enable maven:3.9 -y
    
    - name: install maven and java 
      dnf:
        name:
         - maven 
         - java-25-openjdk-devel
         - mysql
        state: present

    - name: find java25 path
      shell: readlink -f /usr/lib/jvm/java-25-openjdk*/bin/java | head -1
      register: java25

    - name: print the output of java25
      debug:
       msg: "print the output {{java25}}"

    - name: direclty set the java25
      command: alternatives --set java {{java25.stdout}}
    
    - name: perminent set the java25
      copy:
        content: "export JAVA_HOME= {{java25.stdout | dirname | dirname }}"
        dest: /etc/profile.d/java.sh

    - name: Create roboshop  system user
      user:
        name: roboshop
        home: /app
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        comment: 'roboshop system user'
    - name: remove existing data
      file:
        path: /app
        state: absent

    - name: remove existing data
      file:
        path: /tmp/shipping.zip
        state: absent
    
    - name: create app directory 
      file:
        path: /app
        state: directory
    
    - name: download the file from the url
      get_url:
         url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
         dest: /tmp/shipping.zip
    
    - name: Extract local zip file to remote server
      unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: yes
    
    - name: Install npm dependencies in specific directory
      command: mvn clean package
      args:
        chdir: /app
      environment:
        JAVA_HOME: "{{java25.stdout | dirname | dirname }}"
        MAVEN_OPTS: "-Djdk.tls.namedGroups=\"secp256r1,secp384r1,ffdhe2048\""
    
