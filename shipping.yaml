- name: server configurstion for shipping
  hosts: shipping
  become: yes
  tasks:
    - name: enable a maven module 
      command: dnf module enable maven:3.9 -y
    
    - name: install maven and java 
      dnf:
        name:
         - maven 
         - java-25-openjdk-devel
        state: present

    - name: find java25 path
      command: readlink -f /usr/lib/jvm/java-25-openjdk*/bin/java | head -1
      register: java25

    - name: print the output of java25
      debug:
       msg: "print the output {{java25}}"

