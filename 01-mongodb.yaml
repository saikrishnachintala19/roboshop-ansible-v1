- name : create a mongo DB
  hosts: mongodb
  become: yes
  tasks:
  - name: download repos 
    copy:
     src: mongo.repo
     dest: /etc/yum.repos.d/mongo.repo
  - name: print the msg
    debug:
      msg: "this we use for repo"

  - name: install mongodb
    package:
      name: mongodb-org
      state: present
      use: dnf
      
  - name: start the mongo service
    service:
      name: mongodb-org
      state: started
      enabled: yes