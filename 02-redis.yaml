- name:  install a redis package
  hosts: redis
  become: yes
  tasks:
  - name: enable redis using command
    command: dnf module enable redis:7 -y
  - name: install redis 
    package:
       name: redis
       state: present
  - name: replace the content in file
    path: /etc/redis/redis.conf
    regexp: '127\.0\.0\.1'
    replace: '0.0.0.0'
  - name: disable mode
    lineinfile:
      path: /etc/redis/redis.conf
      regexp: '^protected-mode yes'
      replace: 'protected-mode no'
  - name: start and enable
    service:
      name: redis
      state: started
      enabled: true
    