- name: configure payment server setup
  hosts: payment
  become: yes
  tasks:
    - name: install python
      dnf: 
       - python3.14 
       - python3.14-pip
      state: present

    - name: Create roboshop  system user
      user:
        name: roboshop
        home: /app
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        comment: 'roboshop system user'
    - name: remove existing data
      file:
        path: /app
        state: absent

    - name: remove existing data
      file:
        path: /tmp/payment.zip
        state: absent
    
    - name: create app directory 
      file:
        path: /app
        state: directory
    
    - name: download the file from the url
      get_url:
         url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-v4.zip
         dest: /tmp/payment.zip
    
    - name: Extract local zip file to remote server
      unarchive:
        src: /tmp/payment.zip
        dest: /app
        remote_src: yes
    
    - name: Install python dependencies in specific directory
      pip:
       requirements: /app/requirements.txt
       virtualenv: /app/.venv
       virtualenv_command: python3.14 -m venv
    
    - name: copy pyment systmd service file
      template:
        src: payment.systemd.service.j2       # Local path (relative to templates/)
        dest: /etc/systemd/system/payment.service # Remote destination path

    - name: Reload systemd manager configuration
      systemd_service:
        daemon_reload: true
      
    - name: start and ebale the service
      systemd_service:
         name: payment
         state: restarted
         enabled: true 